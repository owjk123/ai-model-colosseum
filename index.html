<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Model Colosseum - AI模型三国杀</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Start Screen Overlay -->
  <div id="start-screen" class="overlay">
    <div class="start-container">
      <canvas id="logo-canvas" width="400" height="120"></canvas>
      <h1 class="game-title">AI MODEL COLOSSEUM</h1>
      <p class="game-subtitle">AI模型三国杀</p>
      
      <div class="setup-section">
        <h3>🎮 选择游戏人数</h3>
        <div class="player-count-btns">
          <button class="count-btn" data-count="4">4人局</button>
          <button class="count-btn active" data-count="6">6人局</button>
          <button class="count-btn" data-count="8">8人局</button>
        </div>
      </div>
      
      <div class="setup-section">
        <h3>⚔️ 选择你的英雄</h3>
        <div id="hero-grid" class="hero-grid"></div>
      </div>
      
      <button id="start-btn" class="neon-button" disabled>
        <span class="btn-text">开始游戏</span>
        <span class="btn-glow"></span>
      </button>
      
      <div class="global-modifier-hint">
        <span id="modifier-display">每局随机全局修饰词将影响游戏</span>
      </div>
    </div>
  </div>
  
  <!-- Identity Reveal Overlay -->
  <div id="identity-overlay" class="overlay hidden">
    <div class="identity-reveal">
      <canvas id="identity-canvas" width="300" height="200"></canvas>
      <h2 id="identity-name"></h2>
      <p id="identity-desc"></p>
    </div>
  </div>
  
  <!-- Main Game Canvas -->
  <canvas id="game-canvas"></canvas>
  
  <!-- Modal Overlay -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="modal-content" class="modal-content"></div>
  </div>
  
  <!-- Result Screen -->
  <div id="result-screen" class="overlay hidden">
    <div class="result-container">
      <h1 id="result-title" class="result-title"></h1>
      <p id="result-message" class="result-message"></p>
      <div id="result-details" class="result-details"></div>
      <button id="play-again-btn" class="neon-button">
        <span class="btn-text">再来一局</span>
        <span class="btn-glow"></span>
      </button>
    </div>
  </div>
  
  <!-- Footer -->
  <div class="footer">
    Powered by <a href="https://www.apiyi.com" target="_blank" rel="noopener">APIYI</a>
  </div>
  
  <script src="game.js"></script>
</body>
</html>
